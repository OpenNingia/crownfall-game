map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache
    location ~* \.(js|css|png|svg|ico|woff2?|ttf|ogg|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Colyseus matchmaking runs over plain HTTP (POST /matchmake/...)
    location /matchmake/ {
        proxy_pass         http://server:2567;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA routes and WebSocket on the same path.
    # WebSocket upgrades are forwarded to the game server;
    # everything else is served as a static file or falls back to index.html.
    location / {
        error_page 418 = @ws;
        if ($http_upgrade = "websocket") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @ws {
        proxy_pass         http://server:2567;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
